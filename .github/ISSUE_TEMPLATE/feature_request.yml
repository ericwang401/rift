name: Feature request
description: Something rift should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features that are not specific to this fork are better proposed
        [upstream](https://github.com/acsandmann/rift) — this fork stays small so
        it can keep rebasing onto upstream cheaply.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The situation, not the solution. What does your window arrangement look
        like, and what does it cost you today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: If you have a shape in mind — a command, a config key, a keybinding.

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried
      description: >-
        Existing commands, rules or layout systems that nearly do it, and where
        they fall short.
